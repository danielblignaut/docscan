[package]
name = "research-optics-native"
version = "0.0.0"
edition = "2024"
publish = false
description = "Harness for docscan/src/exposure.rs: golden parity and timing against the frozen Python arm. No dependencies."

# Its own workspace, so it never joins or rebuilds the docscan crate.
[workspace]

[[bin]]
name = "exposure"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
