[package]
name = "docscan"
version = "0.1.0"
edition = "2024"
description = "In-browser identity document and barcode scanning (SA smart ID, SA ID book, passports MRZ, multi-barcode) in Rust/WebAssembly"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielblignaut/docscan"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `wasm_support` makes chrono read the clock through js-sys: rxing stamps every
# decoded result with `Utc::now()`, which panics in wasm32-unknown-unknown otherwise.
rxing = { version = "0.9", default-features = false, features = ["decoders", "multi_barcode_readers", "full_barcode_format_support", "encoding_rs", "wasm_support"] }
ocrs = "0.13"
rten = "0.26"
rten-tensor = "0.26"
rten-imageproc = "0.26"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
anyhow = "1"
console_error_panic_hook = "0.1"
# Multithreaded wasm (rayon over Web Workers): only in the `threads` build,
# which needs nightly, `-Z build-std` and a cross-origin-isolated page.
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
threads = ["dep:wasm-bindgen-rayon"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
